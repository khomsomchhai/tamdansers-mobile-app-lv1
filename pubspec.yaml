name: tamdansers_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  flutter_bounceable: ^1.2.0
  flutter_svg: ^2.0.0
  table_calendar: ^3.0.9
  # image_picker: ^1.2.1
  percent_indicator: ^4.2.5
  dotted_border: ^2.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  image_picker: ^1.0.7
  lottie: ^3.3.1
  intl: ^0.20.2
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.0 
  path: ^1.9.0
  motion_tab_bar: ^2.0.4
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icons/app_logo.png"
  adaptive_icon_foreground: "assets/icons/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
