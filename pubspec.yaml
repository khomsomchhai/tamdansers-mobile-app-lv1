name: tamdansers_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0
  flutter_bounceable: ^1.2.0
  flutter_svg: ^2.0.0
  table_calendar: ^3.0.9
